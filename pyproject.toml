[project]
name = "modernsheet"
version = "0.46.0"
description = "Modern Sheet: chord sheets (.chs) → lead sheets in Real Book style: CLI, PDF and Flet app"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Mario Cartia" }]
requires-python = ">=3.10"
dependencies = [
    "flet>=1.1.2",
    "reportlab>=4.0",
    "fonttools>=4.40",
]

[project.urls]
Homepage = "https://modernsheet.app"
Documentation = "https://modernsheet.app/it/guida/"

[dependency-groups]
dev = [
    "flet-cli>=1.1.2",
    "flet-desktop>=1.1.2",
    "pytest>=8",
    "markdown>=3.5",            # tools/build_site.py: the website in docs/
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.flet]
org = "app.modernsheet"        # reverse of the domain modernsheet.app
bundle_id = "app.modernsheet"  # App Store / Play Store id (otherwise org + project name)
product = "Modern Sheet"
company = "Mario Cartia"
copyright = "Copyright (C) 2026"

# App icon: src/assets/icon.png (+ icon_ios / icon_windows / icon_linux / icon_web.png), made from
# "MS icon.jpeg" by tools/make_icons.py; this colour is the tile behind the logo (iOS, Android, macOS)
icon_background = "#F6F1E6"

[tool.flet.app]
path = "src"
