# App builds (flet build) for macOS, Windows, Linux and Android, attached to a GitHub Release.
# Runs when a version tag (v0.36.0…) is pushed, or by hand from the Actions tab (then only as artifacts).
# The asset names do not change between versions. A build that fails does not stop the others: the
# release gets the files that were built, and the website's Download page (docs/assets/releases.js) links
# each platform to the newest release that has its file, so a failed platform keeps its previous version.
#
# Google Drive sync needs the app's OAuth client: put the content of src/google_client.json in the
# repository secret GOOGLE_CLIENT_JSON (Settings › Secrets and variables › Actions). Without it the
# builds work, but without Google Drive. The GitHub secret only keeps the file out of the repository:
# the client id and secret end up inside every published app, where anyone can extract them. That is
# expected for installed apps (Google's device flow requires the secret, and Google treats installed-app
# secrets as non-confidential); it gives no access to users' data. See SPEC.md §8.3b.
#
# Android: the APK is signed with the project's release key, so that every new version installs over
# the previous one. Repository secrets: ANDROID_KEYSTORE_BASE64 (the .jks file, base64),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS. Without them the Android job is skipped; it is
# separate from the desktop builds, so a failure there never holds back the desktop release. The same
# key also signs the App Bundle (.aab) for Google Play (the "upload key" of Play App Signing): it is a
# workflow artifact to upload by hand in the Play Console, not a file of the release.
#
# macOS (optional, SPEC §8.6): with a "Developer ID Application" certificate the app is signed with the
# hardened runtime, notarized by Apple and stapled (flet build --macos-distribution developer-id), so it
# opens without warnings. Secrets: MACOS_CERTIFICATE_P12 (the .p12 exported from Keychain Access, base64),
# MACOS_CERTIFICATE_PASSWORD, and an App Store Connect API key for the notary service: APPLE_API_KEY_P8
# (content of the AuthKey_XXXX.p8 file), APPLE_API_KEY_ID, APPLE_API_ISSUER. Without them: unsigned, as before.
#
# iOS (optional): with an "Apple Distribution" certificate and an App Store provisioning profile the
# job builds the .ipa and uploads it to TestFlight (App Store Connect). Secrets: IOS_CERTIFICATE_P12,
# IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE (the .mobileprovision, base64), APPLE_TEAM_ID and the
# same API key as above. Without them the job is skipped. The .ipa is never a file of the release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # create the release and upload its files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            args: --arch arm64 x86_64
            asset: ModernSheet-macos.zip
          - os: windows-latest
            platform: windows
            args: ""
            asset: ModernSheet-windows.zip
          - os: ubuntu-22.04
            platform: linux
            args: ""
            asset: ModernSheet-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Linux build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # libgstreamer1.0-dev needs libunwind-dev, which clashes with the runner's libunwind-14-dev:
          # installing it first resolves the conflict
          sudo apt-get install -y libunwind-dev
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsecret-1-dev libmpv-dev
      - run: pip install -r requirements.txt
      - name: Google OAuth client (optional secret)
        shell: bash
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then
            printf '%s' "$GOOGLE_CLIENT_JSON" > src/google_client.json
            echo "Google Drive: client configured"
          else
            echo "Google Drive: no GOOGLE_CLIENT_JSON secret, building without it"
          fi
      - name: macOS signing and notarization (optional secrets)
        id: macsign
        if: matrix.platform == 'macos'
        shell: bash
        env:
          CERT: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$CERT" ] || [ -z "$API_KEY" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER" ]; then
            echo "No signing secrets: unsigned macOS build"
            exit 0
          fi
          # a temporary keychain with the Developer ID certificate, searched by codesign
          KC="$RUNNER_TEMP/signing.keychain-db"; KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # the notary service key, read by flet build through these variables
          printf '%s' "$API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          { echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8"; echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER=$API_ISSUER"; } >> "$GITHUB_ENV"
          echo "args=--macos-distribution developer-id" >> "$GITHUB_OUTPUT"
      - name: flet build ${{ matrix.platform }}
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: flet build ${{ matrix.platform }} ${{ matrix.args }} ${{ steps.macsign.outputs.args }} --yes --no-rich-output --skip-flutter-doctor
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.platform }}" in
            macos)   (cd build/macos && ditto -c -k --keepParent "Modern Sheet.app" "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}") ;;
            windows) (cd build/windows && 7z a "$GITHUB_WORKSPACE/dist/${{ matrix.asset }}" . > /dev/null) ;;
            linux)   tar -C build/linux -czf "dist/${{ matrix.asset }}" . ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.asset }}
      - name: Remove the signing keychain
        if: always() && matrix.platform == 'macos'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Release key (secret)
        id: key
        shell: bash
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: skipping the Android build"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.key.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-java@v4
        if: steps.key.outputs.ok == 'true'
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.key.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - name: Google OAuth client (optional secret)
        if: steps.key.outputs.ok == 'true'
        shell: bash
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then
            printf '%s' "$GOOGLE_CLIENT_JSON" > src/google_client.json
            echo "Google Drive: client configured"
          else
            echo "Google Drive: no GOOGLE_CLIENT_JSON secret, building without it"
          fi
      - name: flet build apk
        if: steps.key.outputs.ok == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/release.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flet build apk --split-per-abi --build-number ${{ github.run_number }} --yes --no-rich-output --skip-flutter-doctor
      - name: flet build aab (Google Play)
        if: steps.key.outputs.ok == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
          FLET_ANDROID_SIGNING_KEY_STORE: ${{ runner.temp }}/release.jks
          FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: flet build aab --build-number ${{ github.run_number }} --yes --no-rich-output --skip-flutter-doctor
      - name: Package
        if: steps.key.outputs.ok == 'true'
        shell: bash
        run: |
          mkdir -p dist play
          cp build/apk/*arm64-v8a*.apk dist/ModernSheet-android.apk
          cp build/aab/*.aab play/ModernSheet-android.aab
          ls -la build/apk build/aab dist play
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ok == 'true'
        with:
          name: android
          path: dist/ModernSheet-android.apk
      - uses: actions/upload-artifact@v4          # for the Play Console, not for the release
        if: steps.key.outputs.ok == 'true'
        with:
          name: google-play
          path: play/ModernSheet-android.aab

  ios:
    runs-on: macos-latest
    steps:
      - name: Signing secrets
        id: sign
        shell: bash
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$CERT" ] || [ -z "$PROFILE" ] || [ -z "$TEAM" ]; then
            echo "No iOS signing secrets: skipping the iOS build"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.sign.outputs.ok == 'true'
      - uses: actions/setup-python@v5
        if: steps.sign.outputs.ok == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.sign.outputs.ok == 'true'
        run: pip install -r requirements.txt
      - name: Google OAuth client (optional secret)
        if: steps.sign.outputs.ok == 'true'
        shell: bash
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then printf '%s' "$GOOGLE_CLIENT_JSON" > src/google_client.json; fi
      - name: Certificate and provisioning profile
        id: profile
        if: steps.sign.outputs.ok == 'true'
        shell: bash
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          KC="$RUNNER_TEMP/ios.keychain-db"; KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/ios.p12"
          security import "$RUNNER_TEMP/ios.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/ios.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"        # xcodebuild looks for the identity here
          security find-identity -v -p codesigning "$KC"   # names only: shows that the key came with the certificate
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "uuid=$UUID" >> "$GITHUB_OUTPUT"
      - name: flet build ipa
        if: steps.sign.outputs.ok == 'true'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          # every upload needs a new build number (TestFlight and Play refuse a number already used): the run number
          flet build ipa --build-number ${{ github.run_number }} --ios-team-id "${{ secrets.APPLE_TEAM_ID }}" --ios-export-method app-store-connect \
            --ios-provisioning-profile "${{ steps.profile.outputs.uuid }}" --ios-signing-certificate "Apple Distribution" \
            --yes --no-rich-output --skip-flutter-doctor
          mkdir -p ios && cp build/ipa/*.ipa ios/ModernSheet-ios.ipa
      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.ok == 'true'
        with:
          name: ios
          path: ios/ModernSheet-ios.ipa
      - name: Upload to TestFlight (with the App Store Connect API key)
        if: steps.sign.outputs.ok == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        shell: bash
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$API_KEY" ]; then echo "No App Store Connect API key: upload the .ipa by hand"; exit 0; fi
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          xcrun altool --upload-app -f ios/ModernSheet-ios.ipa -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER"
      - name: Remove the signing keychain
        if: always() && steps.sign.outputs.ok == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/ios.keychain-db" 2>/dev/null || true

  release:
    # every build that succeeded is published, even if others failed (or the Android job was skipped):
    # the Download page keeps the previous version for the platforms missing here
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') }}
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Keep only the downloadable apps (.aab and .ipa go to the stores)
        shell: bash
        run: rm -f dist/*.aab dist/*.ipa
      - name: Release notes (only the files that were built)
        id: notes
        shell: bash
        env:
          MAC_SIGNED: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_API_KEY_P8 != '' }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then echo "none=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          label() {
            case "$1" in
              ModernSheet-macos.zip) echo "**macOS** (Apple Silicon e Intel)" ;;
              ModernSheet-windows.zip) echo "**Windows** (64 bit)" ;;
              ModernSheet-linux.tar.gz) echo "**Linux** (x86_64)" ;;
              ModernSheet-android.apk) echo "**Android** (64 bit, sperimentale · experimental)" ;;
            esac
          }
          all="ModernSheet-macos.zip ModernSheet-windows.zip ModernSheet-linux.tar.gz ModernSheet-android.apk"
          {
            echo "App di Modern Sheet ${GITHUB_REF_NAME} · Apps."
            echo
            missing=""
            for name in $all; do
              if [ -f "dist/$name" ]; then echo "- $(label "$name"): \`$name\`"; else missing="$missing, $(label "$name")"; fi
            done
            if [ -n "$missing" ]; then
              echo
              echo "Non compilate in questa versione (nella pagina Download resta la precedente) · Not built in this version (the Download page keeps the previous one): ${missing#, }"
            fi
            echo
            # "signed" only if the signing secrets exist AND the macOS app was actually built
            if [ "$MAC_SIGNED" = "true" ] && [ -f dist/ModernSheet-macos.zip ]; then
              echo "L'app per macOS è firmata e notarizzata da Apple; Windows, Linux e Android non sono firmate con un certificato di uno store · The macOS app is signed and notarized by Apple. Istruzioni · Instructions: https://modernsheet.app/it/download/ (English: https://modernsheet.app/en/download/)."
            else
              echo "Le app non sono firmate: istruzioni per aprirle su https://modernsheet.app/it/download/ (English: https://modernsheet.app/en/download/)."
            fi
          } > notes.md
      - uses: softprops/action-gh-release@v2
        if: steps.notes.outputs.none != 'true'
        with:
          name: Modern Sheet ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: false
          body_path: notes.md
